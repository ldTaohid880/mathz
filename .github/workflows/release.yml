name: Release Plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Validate tag matches manifest version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          MANIFEST_VER=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VER" ]; then
            echo "Error: Tag ($TAG) does not match manifest version ($MANIFEST_VER)"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes
