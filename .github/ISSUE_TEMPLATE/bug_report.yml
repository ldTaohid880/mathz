name: Bug Report
description: Create a report to help us reproduce and fix a bug in Mathz
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian Version
      placeholder: e.g. 1.5.8
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Mathz Plugin Version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform / OS
      placeholder: e.g. Windows, macOS, Linux, iOS, Android
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Obsidian Theme
      placeholder: e.g. Default (Dark), Minimal, Anppur
    validations:
      required: false
  - type: textarea
    id: mathz-block
    attributes:
      label: Mathz Code Block
      description: The exact ```mathz code block content that triggered the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages or screenshots if applicable)
    validations:
      required: true
